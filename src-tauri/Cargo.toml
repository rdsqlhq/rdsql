[package]
name = "rdsql-desktop"
version = "1.1.6"
description = "rdSQL Desktop - Modern Database Workspace"
authors = ["rdSQL Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
tauri = { version = "^2.0", features = ["devtools"] }
tauri-plugin-opener = "^2.0"
tauri-plugin-dialog = "^2.0"
tauri-plugin-fs = "^2.0"
tauri-plugin-process = "^2.0"
tauri-plugin-deep-link = "^2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
duckdb = { version = "1.105", features = ["bundled", "chrono"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
# SQL Server (TDS protocol). rustls to match the mysql_async/reqwest convention
# elsewhere in this crate — avoids an OpenSSL/native-tls system dependency.
# `tds73` unlocks the DATE/TIME/DATETIME2/DATETIMEOFFSET column types (TDS 7.3,
# i.e. SQL Server 2008+) — without it tiberius falls back to the legacy
# low-precision DATETIME/SMALLDATETIME types only.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "tds73"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Backend auth (accounts, OAuth pairing, cloud sync) — see commands::backend.
# OS-native credential store for the session token and the local sync
# passphrase-derived key material, replacing the storage.rs stub.
keyring = "4"

# S3-compatible object storage (AWS S3, Cloudflare R2, MinIO, B2, Wasabi, …).
# Used exclusively by the isolated storage module (`commands::s3`); no other
# subsystem depends on these. `behavior-version-latest` pins the client's
# runtime behavior model — required at construction time by the SDK.
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"
# Optional gzip for S3-bound backups (default-off in the UI so local backups
# keep their exact current plain-text output).
flate2 = "1"
# Multipart-upload part checksums (Content-MD5 / trailer).
md-5 = "0.10"
# Hex/percent helpers + base64 for presign-free flows.
hex = "0.4"
percent-encoding = "2"
# Tiny regex impl for scrubbing credentials out of error messages before they
# cross the command boundary (defense-in-depth — no std regex dependency).
regex-lite = "0.1"
# Base64 encoding for object-byte previews returned over IPC.
base64 = "0.22"

# Redis / Valkey key-value store (isolated module: `commands::redis`).
# tokio-rustls-comp matches the rustls convention already used by
# mysql_async/reqwest elsewhere in this crate — no native-tls system dep.
redis = { version = "1.5", features = ["tokio-comp", "tokio-rustls-comp"] }

# SSH tunnel / jump-server support (`commands::ssh_tunnel`), used by every
# networked engine (Postgres, MySQL, SQL Server, Redis). Pure-Rust async SSH
# client — default features (aws-lc-rs, rsa, flate2) add no new toolchain
# requirement here: aws-lc-rs and ring are already transitive deps via
# aws-sdk-s3/rustls.
russh = "0.62"

# MongoDB (isolated module: `commands::mongo`, mirroring `commands::redis`).
# Official driver; default features already cover what this app needs —
# `rustls-tls` (matches the rustls convention used elsewhere, no native-tls
# system dep) and `dns-resolver` (required to resolve `mongodb+srv://`
# Atlas-style connection strings). BSON document/value types are used via
# this crate's own `mongodb::bson` re-export — no separate `bson` dependency.
mongodb = "3.8"

# The updater only makes sense where we ship installers. Gating it keeps mobile
# targets buildable, since the plugin has no Android/iOS implementation.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "^2.0"
